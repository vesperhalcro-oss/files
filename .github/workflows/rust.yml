name: Tactical Mapper CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Check formatting
      working-directory: foveated_lidar_gui
      run: cargo fmt --check
    - name: Build release
      working-directory: foveated_lidar_gui
      run: cargo build --release
    - name: Run clippy
      working-directory: foveated_lidar_gui
      run: cargo clippy -- -D warnings
